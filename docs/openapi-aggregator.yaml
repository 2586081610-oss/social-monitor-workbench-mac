openapi: 3.0.3
info:
  title: 博主监控 + AI 笔记工作台 — 聚合 API
  version: 1.0.0
  description: |
    四平台（小红书/抖音/推特X/B站）博主监控、三件套（下载→转写→语义关键帧→AI 笔记）
    进度、分组/双层标签/待分类/词库/凭据健康度的聚合 REST API。
    前端据此生成 TS 类型 + MSW Mock；后端据此实现。变更必须先改本文件。
  contact:
    name: 首席架构师 高见远

servers:
  - url: http://localhost:8000
    description: 本机开发/部署（MVP 单机）

tags:
  - name: creators
    description: 博主管理（四平台添加/删除/归组/启停）
  - name: works
    description: 作品与三件套状态、重试、手动分析、归类
  - name: archive
    description: path-keyed 本地归档索引、核对、任务、文件与 CSV
  - name: link-analyses
    description: 用户提交单条视频链接后的手动入库
  - name: groups
    description: 博主分组（手动，一博主一组）
  - name: tags
    description: 双层标签（大标签 big / 小标签 small）与检索
  - name: unclassified
    description: 待分类队列（P2 完整，P1 空态）
  - name: lexicon
    description: 词库系统（语义对齐抽帧驱动）
  - name: health
    description: 凭据/系统健康度
  - name: monitor
    description: 监控层手动触发
  - name: wechat
    description: 公众号导入（接口预留）
  - name: xhs-comments
    description: 小红书单作品评论采集任务、结构化结果、报告与评论图片

security:
  - bearerAuth: []

paths:
  # ==================== creators ====================
  /api/v1/creators:
    get:
      tags: [creators]
      summary: 博主列表（支持分组/平台/关键词过滤 + 分页）
      operationId: listCreators
      parameters:
        - $ref: '#/components/parameters/GroupIdQuery'
        - name: platform
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Platform' }
        - name: q
          in: query
          required: false
          description: 按博主名模糊搜索
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 博主分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [creators]
      summary: 添加博主（选平台 + 归组）
      operationId: createCreator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatorCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Creator' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/creators/{creator_id}:
    parameters:
      - { $ref: '#/components/parameters/CreatorId' }
    get:
      tags: [creators]
      summary: 博主详情（含最近作品摘要）
      operationId: getCreator
      responses:
        '200':
          description: 博主详情
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CreatorDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [creators]
      summary: 修改博主（改名/换组/启停）
      operationId: updateCreator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatorUpdate' }
      responses:
        '200':
          description: 更新后博主
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Creator' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [creators]
      summary: 删除博主
      operationId: deleteCreator
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/creators/{creator_id}/works:
    parameters:
      - { $ref: '#/components/parameters/CreatorId' }
    get:
      tags: [creators, works]
      summary: 博主作品列表 + 三件套状态
      operationId: listCreatorWorks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 该博主作品分页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== link analyses ====================
  /api/v1/link-analyses:
    post:
      tags: [link-analyses]
      summary: 创建或复用一条手动视频链接分析
      operationId: createLinkAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkAnalysisCreate' }
      responses:
        '201':
          description: 手动作品已创建或已复用
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LinkAnalysisResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/link-analyses/identify:
    post:
      tags: [link-analyses]
      summary: 识别一条作品链接
      operationId: identifyLinkAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkAnalysisUrl' }
      responses:
        '200':
          description: 已识别平台和作品 ID
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LinkAnalysisIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/link-analyses/download:
    post:
      tags: [link-analyses]
      summary: 下载一条作品链接
      operationId: downloadSingleLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkAnalysisUrl' }
      responses:
        '200':
          description: 已识别作品并启动下载，或返回已有结果
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SingleLinkDownloadResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ==================== works ====================
  /api/v1/works:
    get:
      tags: [works]
      summary: 作品库（多条件过滤 + 分页）
      operationId: listWorks
      parameters:
        - $ref: '#/components/parameters/GroupIdQuery'
        - name: creator_id
          in: query
          required: false
          schema: { type: integer }
        - name: tag
          in: query
          required: false
          description: '标签名（不带 #），如 美联储'
          schema: { type: string }
        - name: platform
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Platform' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/WorkStatus' }
        - name: source_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SourceType' }
        - name: unclassified
          in: query
          required: false
          description: true = 仅待分类（group_id 为空）
          schema: { type: boolean }
        - name: q
          in: query
          required: false
          description: 标题模糊搜索
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 作品分页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/works/{work_id}:
    parameters:
      - { $ref: '#/components/parameters/WorkId' }
    get:
      tags: [works]
      summary: 作品详情（状态/标签/帧/路径）
      operationId: getWork
      responses:
        '200':
          description: 作品详情
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/works/{work_id}/retry:
    parameters:
      - { $ref: '#/components/parameters/WorkId' }
    post:
      tags: [works]
      summary: 单条重试（FAILED → QUEUED）
      operationId: retryWork
      responses:
        '200':
          description: 重试已入队
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Work' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/works/{work_id}/analyze:
    parameters:
      - { $ref: '#/components/parameters/WorkId' }
    post:
      tags: [works]
      summary: 手动触发 AI 笔记（对话手动入口，生成/刷新素材就绪清单）
      operationId: analyzeWork
      responses:
        '200':
          description: 已生成素材就绪清单，待 WorkBuddy 执行
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          note_pending: { type: boolean, example: true }
                          pending_file: { type: string, example: workbuddy/pending/12-2026-08-22-xxx.json }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/works/{work_id}/complete-note:
    parameters:
      - { $ref: '#/components/parameters/WorkId' }
    post:
      tags: [works]
      summary: 回填已由 Codex 写入的本地 Obsidian 笔记
      operationId: completeNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteCompletionRequest' }
      responses:
        '200':
          description: 笔记路径已验证，作品已完成
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Work' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/works/{work_id}/classify:
    parameters:
      - { $ref: '#/components/parameters/WorkId' }
    post:
      tags: [works, unclassified]
      summary: 待分类手动归类（设分组 + 标签，可选绑博主）；原子移动 media 与 Obsidian 双目录
      operationId: classifyWork
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassifyRequest' }
      responses:
        '200':
          description: 归类完成
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Work' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/works/{work_id}/frames:
    parameters:
      - { $ref: '#/components/parameters/WorkId' }
    get:
      tags: [works]
      summary: 关键帧列表（读取 frame_manifest.json）
      operationId: listWorkFrames
      responses:
        '200':
          description: 关键帧列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          semantic_aligned: { type: boolean, example: true }
                          fallback: { type: boolean, example: false }
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Frame' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== archive ====================
  /api/v1/archive:
    get:
      tags: [archive]
      summary: 本地归档分页列表（筛选和页面共用）
      operationId: listArchiveEntries
      parameters:
        - name: platform
          in: query
          schema: { $ref: '#/components/schemas/Platform' }
        - name: creator_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: group_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: work_id
          in: query
          description: 可重复传入；一个 Work 可对应多个真实目录
          style: form
          explode: true
          schema:
            oneOf:
              - { type: integer, minimum: 1 }
              - type: array
                items: { type: integer, minimum: 1 }
        - name: root_key
          in: query
          schema: { type: string, maxLength: 32 }
        - name: q
          in: query
          description: 标题、作品 ID、链接、博主或分组文字
          schema: { type: string, maxLength: 200 }
        - name: check_status
          in: query
          schema: { $ref: '#/components/schemas/ArchiveCheckStatus' }
        - name: time_field
          in: query
          schema: { $ref: '#/components/schemas/ArchiveTimeField', default: published_at }
        - name: date_from
          in: query
          description: 北京时间日历日，包含当天
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: 北京时间日历日，包含当天
          schema: { type: string, format: date }
        - name: include_unknown_time
          in: query
          description: 日期范围筛选时额外包含所选时间为空的记录
          schema: { type: boolean, default: false }
        - name: unknown_time_only
          in: query
          description: 只选所选时间为空的记录
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ArchiveLimit'
      responses:
        '200':
          description: 归档分页列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArchivePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/archive/policy:
    get:
      tags: [archive]
      summary: 生效的时区、目录与信息文件规则及允许根
      operationId: getArchivePolicy
      responses:
        '200':
          description: 不含绝对路径的本机归档规则
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArchivePolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/archive/export.csv:
    get:
      tags: [archive]
      summary: 导出全部匹配筛选的归档记录
      operationId: exportArchiveCsv
      description: 与 GET /archive 共用筛选条件；忽略 page 和 limit。成功返回原始 UTF-8 BOM CSV，错误仍是 JSON Envelope。
      parameters:
        - name: platform
          in: query
          schema: { $ref: '#/components/schemas/Platform' }
        - name: creator_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: group_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: work_id
          in: query
          style: form
          explode: true
          schema:
            oneOf:
              - { type: integer, minimum: 1 }
              - type: array
                items: { type: integer, minimum: 1 }
        - name: root_key
          in: query
          schema: { type: string, maxLength: 32 }
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: check_status
          in: query
          schema: { $ref: '#/components/schemas/ArchiveCheckStatus' }
        - name: time_field
          in: query
          schema: { $ref: '#/components/schemas/ArchiveTimeField', default: published_at }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: include_unknown_time
          in: query
          schema: { type: boolean, default: false }
        - name: unknown_time_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 全量 UTF-8 BOM CSV
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/archive/scan:
    post:
      tags: [archive]
      summary: 为一个允许根创建可恢复的索引任务
      operationId: createArchiveScan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveScanRequest' }
      responses:
        '202':
          description: 已持久化的扫描任务
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArchiveJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/archive/jobs/{job_id}:
    parameters:
      - { $ref: '#/components/parameters/ArchiveJobId' }
    get:
      tags: [archive]
      summary: 获取扫描、刷新或同步任务进度
      operationId: getArchiveJob
      responses:
        '200':
          description: 归档任务状态和持久游标
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArchiveJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/archive/{archive_id}:
    parameters:
      - { $ref: '#/components/parameters/ArchiveId' }
    get:
      tags: [archive]
      summary: 归档详情、媒体文件清单和修订历史
      operationId: getArchiveEntry
      responses:
        '200':
          description: 归档详情
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArchiveEntryDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/archive/{archive_id}/info.csv:
    parameters:
      - { $ref: '#/components/parameters/ArchiveId' }
    get:
      tags: [archive]
      summary: 导出单作品信息 CSV
      operationId: exportArchiveEntryCsv
      description: 成功返回原始 UTF-8 BOM CSV；错误使用 JSON Envelope。
      responses:
        '200':
          description: 单作品 CSV
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/archive/{archive_id}/files/{file_id}:
    parameters:
      - { $ref: '#/components/parameters/ArchiveId' }
      - { $ref: '#/components/parameters/ArchiveFileId' }
    get:
      tags: [archive]
      summary: 按已登记文件 ID 读取媒体
      operationId: getArchiveFile
      description: 成功返回原始媒体字节；路径只能从该归档清单解析并校验允许根。错误使用 JSON Envelope。
      responses:
        '200':
          description: 已登记媒体文件
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/archive/{archive_id}/refresh:
    parameters:
      - { $ref: '#/components/parameters/ArchiveId' }
    post:
      tags: [archive]
      summary: 创建独立作品元数据刷新任务
      operationId: refreshArchiveEntry
      responses:
        '202':
          description: 已持久化的刷新任务
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArchiveJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/archive/{archive_id}/metadata:
    parameters:
      - { $ref: '#/components/parameters/ArchiveId' }
    patch:
      tags: [archive]
      summary: 人工修正归档元数据并保留修订审计
      operationId: patchArchiveMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveMetadataPatch' }
      responses:
        '200':
          description: 更新后的归档记录
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArchiveEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/archive/{archive_id}/sync:
    parameters:
      - { $ref: '#/components/parameters/ArchiveId' }
    post:
      tags: [archive]
      summary: 创建单作品信息文件同步重试任务
      operationId: syncArchiveEntry
      responses:
        '202':
          description: 已持久化的同步任务
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArchiveJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== groups ====================
  /api/v1/groups:
    get:
      tags: [groups]
      summary: 分组列表（含博主数）
      operationId: listGroups
      responses:
        '200':
          description: 分组列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [groups]
      summary: 创建分组
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/groups/{group_id}:
    parameters:
      - { $ref: '#/components/parameters/GroupId' }
    patch:
      tags: [groups]
      summary: 重命名分组（仅影响后续作品目录）
      operationId: renameGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupUpdate' }
      responses:
        '200':
          description: 更新后分组
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [groups]
      summary: 删除分组（组内博主移入未分组，作品保留）
      operationId: deleteGroup
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
                          moved_creators: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ==================== tags ====================
  /api/v1/tags:
    get:
      tags: [tags]
      summary: 标签列表（含作品数，可过滤大/小标签）
      operationId: listTags
      parameters:
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TagKind' }
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Tag' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tags/{tag_name}/works:
    parameters:
      - name: tag_name
        in: path
        required: true
        description: '标签名（不带 #）'
        schema: { type: string }
    get:
      tags: [tags]
      summary: 按标签查作品（标签检索入口）
      operationId: listWorksByTag
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 该标签下作品分页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== unclassified ====================
  /api/v1/unclassified:
    get:
      tags: [unclassified]
      summary: 待分类队列（group_id 为空的未归类作品池）
      operationId: listUnclassified
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 待分类作品分页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==================== lexicon ====================
  /api/v1/lexicon:
    get:
      tags: [lexicon]
      summary: 词库词条列表
      operationId: listLexicon
      responses:
        '200':
          description: 词条列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/LexiconItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [lexicon]
      summary: 新增词条
      operationId: createLexiconEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LexiconCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LexiconItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/lexicon/{entry_id}:
    parameters:
      - name: entry_id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [lexicon]
      summary: 修改词条（词/动作/权重/启停）
      operationId: updateLexiconEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LexiconUpdate' }
      responses:
        '200':
          description: 更新后词条
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LexiconItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [lexicon]
      summary: 删除词条（删除后不再触发抽帧）
      operationId: deleteLexiconEntry
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== health ====================
  /api/v1/health/cookie:
    get:
      tags: [health]
      summary: 凭据健康度（各平台 OK/WARN/NEEDS_RELOGIN + 最近轮询时间）
      operationId: getCookieHealth
      responses:
        '200':
          description: 凭据健康列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/CookieHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/health/system:
    get:
      tags: [health]
      summary: 系统健康（RSSHub/changedetection/下载器/转写引擎在线状态）
      operationId: getSystemHealth
      responses:
        '200':
          description: 系统健康列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/SystemHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==================== monitor ====================
  /api/v1/monitor/poll:
    post:
      tags: [monitor]
      summary: 手动触发轮询（立即检测新作品，可指定平台）
      operationId: triggerPoll
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  description: 不传则全部平台
                  schema: { $ref: '#/components/schemas/Platform' }
      responses:
        '200':
          description: 轮询已触发
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          triggered: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/MonitorOffline' }

  # ==================== wechat (预留) ====================
  /api/v1/wechat/import:
    post:
      tags: [wechat]
      summary: 公众号导入（接口预留占位，P1 返回 501）
      operationId: wechatImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WechatImportRequest' }
      responses:
        '501': { $ref: '#/components/responses/NotImplemented' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==================== xhs comments ====================
  /api/v1/xhs-comments/jobs:
    post:
      tags: [xhs-comments]
      summary: 创建单作品评论采集任务（只处理这一条作品）
      operationId: createXhsCommentJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/XhsCommentJobCreate' }
      responses:
        '202':
          description: 任务已创建或返回同作品进行中的任务
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/XhsCommentJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/xhs-comments/jobs/{job_id}:
    get:
      tags: [xhs-comments]
      summary: 采集任务进度与状态（含分页/图片/语音计数）
      operationId: getXhsCommentJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/XhsCommentJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/xhs-comments/jobs/{job_id}/retry:
    post:
      tags: [xhs-comments]
      summary: 按原作品与选项重新采集（结果按评论 ID 合并）
      operationId: retryXhsCommentJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                voice_authorized:
                  type: boolean
                  default: false
                  description: 原任务包含语音提取时必须重新授权本次操作
                voice_allow_open_page:
                  type: boolean
                  nullable: true
                  description: 未找到已打开的作品页时是否允许新开标签页；省略则沿用原任务的选择
      responses:
        '202':
          description: 已创建新的采集任务
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/XhsCommentJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/xhs-comments/notes:
    get:
      tags: [xhs-comments]
      summary: 已保存评论结果列表（刷新后重新打开）
      operationId: listXhsCommentNotes
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 结果摘要列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/XhsCommentNoteSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/xhs-comments/notes/{note_id}:
    get:
      tags: [xhs-comments]
      summary: 完整结构化评论结果（含完整性状态）
      operationId: getXhsCommentResult
      parameters:
        - name: note_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 评论结果
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/XhsCommentResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/xhs-comments/notes/{note_id}/report.md:
    get:
      tags: [xhs-comments]
      summary: 可阅读的 Markdown 评论报告
      operationId: getXhsCommentReport
      parameters:
        - name: note_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Markdown 报告
          content:
            text/markdown:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/xhs-comments/notes/{note_id}/images/{filename}:
    get:
      tags: [xhs-comments]
      summary: 已登记评论图片（仅评论目录内的文件）
      operationId: getXhsCommentImage
      parameters:
        - name: note_id
          in: path
          required: true
          schema: { type: string }
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 图片文件
          content:
            image/*:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '管理口令（ADMIN_TOKEN），形如 Authorization: Bearer <ADMIN_TOKEN>'

  parameters:
    CreatorId:
      name: creator_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    WorkId:
      name: work_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ArchiveId:
      name: archive_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ArchiveJobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArchiveFileId:
      name: file_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    GroupId:
      name: group_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    GroupIdQuery:
      name: group_id
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ArchiveLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }

  schemas:
    Envelope:
      type: object
      description: 统一响应包装。code=0 成功；非 0 为业务错误码（见 SPEC §4.1）
      required: [code, data, message]
      properties:
        code:
          type: integer
          example: 0
        data: {}
        message:
          type: string
          example: ''

    Platform:
      type: string
      enum: [douyin, bilibili, xhs, twitter, wechat]
      description: 平台标识（wechat 仅预留）

    WorkStatus:
      type: string
      enum: [NEW, QUEUED, DOWNLOADING, DOWNLOADED, TRANSCRIBING, FRAME_EXTRACTING, NOTE_GENERATING, DONE, FAILED, UNCLASSIFIED]

    SourceType:
      type: string
      enum: [monitor, like, favorite, manual]

    LinkAnalysisCreate:
      type: object
      required: [url, platform, external_id]
      properties:
        url: { type: string, format: uri, maxLength: 2000 }
        platform:
          type: string
          enum: [douyin, bilibili, xhs, twitter]
        external_id: { type: string, minLength: 1, maxLength: 200 }
        mode:
          type: string
          enum: [one_time, monitor]
          default: one_time

    LinkAnalysisResult:
      type: object
      required: [work, created, mode]
      properties:
        work: { $ref: '#/components/schemas/Work' }
        created: { type: boolean }
        mode:
          type: string
          enum: [one_time, monitor]

    LinkAnalysisUrl:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 2000 }

    LinkAnalysisIdentity:
      type: object
      required: [platform, external_id]
      properties:
        platform: { type: string, enum: [douyin, bilibili, xhs, twitter] }
        external_id: { type: string }

    SingleLinkDownloadResult:
      type: object
      required: [work, created, platform, external_id, content_type, processing, message]
      properties:
        work: { $ref: '#/components/schemas/Work' }
        created: { type: boolean }
        platform: { type: string, enum: [douyin, bilibili, xhs, twitter] }
        external_id: { type: string }
        content_type: { type: string }
        processing: { type: boolean }
        message: { type: string }

    NoteCompletionRequest:
      type: object
      required: [note_path]
      properties:
        note_path: { type: string, minLength: 1, maxLength: 500 }

    TagKind:
      type: string
      enum: [big, small]

    # ---------- creators ----------
    CreatorCreate:
      type: object
      required: [platform, name, profile_url, external_id]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        name:
          type: string
          minLength: 1
          maxLength: 100
        profile_url:
          type: string
          format: uri
        external_id:
          type: string
          description: sec_uid / uid / user_id / handle
          minLength: 1
          maxLength: 200
        group_id:
          type: integer
          nullable: true
          description: 为空则博主暂不归组

    CreatorUpdate:
      type: object
      description: 部分字段更新
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        group_id:
          type: integer
          nullable: true
        enabled:
          type: boolean
        poll_interval_seconds:
          type: integer
          nullable: true
          minimum: 60
          maximum: 2592000
          description: 自定义检测间隔（秒）；null=清除自定义、恢复跟随平台默认

    Creator:
      type: object
      required: [id, platform, name, profile_url, external_id, enabled]
      properties:
        id: { type: integer }
        group_id: { type: integer, nullable: true }
        platform: { $ref: '#/components/schemas/Platform' }
        name: { type: string }
        profile_url: { type: string }
        external_id: { type: string }
        enabled: { type: boolean }
        last_poll_at: { type: string, format: date-time, nullable: true }
        last_work_at: { type: string, format: date-time, nullable: true }
        poll_interval_seconds: { type: integer, nullable: true, description: 自定义检测间隔（秒），null=跟随平台默认 }
        next_poll_at: { type: string, format: date-time, nullable: true, description: 下次计划检测时间（null=立即到期） }
        poll_fail_streak: { type: integer, description: 连续检测失败次数，≥2 前端警示 }
        last_poll_error: { type: string, nullable: true, description: 最近一次检测失败原因 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreatorDetail:
      allOf:
        - { $ref: '#/components/schemas/Creator' }
        - type: object
          properties:
            recent_works:
              type: array
              description: 最近作品摘要（≤5 条）
              items: { $ref: '#/components/schemas/WorkSummary' }

    CreatorPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Creator' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }

    # ---------- works ----------
    Work:
      type: object
      required: [id, platform, external_id, title, url, source_type, status, downloaded_at, download_time_source]
      properties:
        id: { type: integer }
        creator_id: { type: integer, nullable: true }
        group_id: { type: integer, nullable: true, description: null = 待分类 }
        platform: { $ref: '#/components/schemas/Platform' }
        external_id: { type: string }
        title: { type: string }
        url: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        downloaded_at: { type: string, format: date-time, nullable: true }
        download_time_source: { type: string, nullable: true }
        archive_check_status:
          type: string
          nullable: true
          enum: [verified, needs_review, conflict, failed]
          description: 多个物理归档按冲突、失败、待核验、已核验优先级汇总
        source_type: { $ref: '#/components/schemas/SourceType' }
        status: { $ref: '#/components/schemas/WorkStatus' }
        task_id: { type: string, nullable: true }
        media_path: { type: string, nullable: true }
        note_path: { type: string, nullable: true }
        frame_count: { type: integer, default: 0 }
        retry_count: { type: integer, default: 0 }
        last_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        status: { $ref: '#/components/schemas/WorkStatus' }
        published_at: { type: string, format: date-time, nullable: true }
        downloaded_at: { type: string, format: date-time, nullable: true }
        download_time_source: { type: string, nullable: true }
        archive_check_status:
          type: string
          nullable: true
          enum: [verified, needs_review, conflict, failed]
          description: 多个物理归档按冲突、失败、待核验、已核验优先级汇总

    WorkDetail:
      allOf:
        - { $ref: '#/components/schemas/Work' }
        - type: object
          properties:
            tags:
              type: array
              items: { $ref: '#/components/schemas/Tag' }
            stages:
              type: array
              description: 阶段级任务状态
              items: { $ref: '#/components/schemas/TaskStage' }
            transcript_path: { type: string, nullable: true }
            frame_manifest_path: { type: string, nullable: true }

    WorkPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Work' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }

    # ---------- local archive ----------
    ArchiveCheckStatus:
      type: string
      enum: [verified, needs_review, conflict, failed]

    ArchiveSyncStatus:
      type: string
      enum: [pending, ready, failed]

    ArchiveJobType:
      type: string
      enum: [scan, refresh, sync]

    ArchiveJobStatus:
      type: string
      enum: [queued, running, completed, partial, failed]

    ArchiveTimeField:
      type: string
      enum: [published_at, downloaded_at]

    ArchiveFile:
      type: object
      required: [file_id, relative_path, name, size_bytes]
      properties:
        file_id: { type: string, minLength: 1, maxLength: 200, description: 稳定文件标识 }
        relative_path: { type: string, maxLength: 1000, description: 相对当前归档目录的路径 }
        name: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        media_type: { type: string, nullable: true }
        sha256: { type: string, nullable: true }

    ArchiveEntry:
      type: object
      required: [id, root_key, relative_directory, work_id, platform, external_id, title, url, creator_id, creator_label, group_id, group_label, published_at, published_time_source, published_time_precision, downloaded_at, download_time_source, download_time_precision, metadata_checked_at, check_status, metadata_version, metadata, files, sync_status, sync_error, synced_at, created_at, updated_at]
      properties:
        id: { type: integer }
        root_key: { type: string, maxLength: 32 }
        relative_directory: { type: string, description: 归档根内的相对目录 }
        work_id: { type: integer, nullable: true, description: 匹配到的流水线作品 ID }
        platform: { $ref: '#/components/schemas/Platform' }
        external_id: { type: string, nullable: true }
        title: { type: string }
        url: { type: string, nullable: true }
        creator_id: { type: integer, nullable: true }
        creator_label: { type: string, nullable: true }
        group_id: { type: integer, nullable: true }
        group_label: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        published_time_source: { type: string, nullable: true }
        published_time_precision: { type: string, nullable: true }
        downloaded_at: { type: string, format: date-time, nullable: true }
        download_time_source: { type: string, nullable: true }
        download_time_precision: { type: string, nullable: true }
        metadata_checked_at: { type: string, format: date-time, nullable: true }
        check_status: { $ref: '#/components/schemas/ArchiveCheckStatus' }
        metadata_version: { type: integer, minimum: 1 }
        metadata:
          type: object
          additionalProperties: true
          description: 按 metadata_version 解释的版本化附加元数据
        files:
          type: array
          items: { $ref: '#/components/schemas/ArchiveFile' }
        sync_status: { $ref: '#/components/schemas/ArchiveSyncStatus' }
        sync_error: { type: string, nullable: true }
        synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ArchiveRevision:
      type: object
      required: [id, archive_entry_id, before_values, after_values, source, changed_at]
      properties:
        id: { type: integer }
        archive_entry_id: { type: integer }
        before_values: { type: object, additionalProperties: true }
        after_values: { type: object, additionalProperties: true }
        source: { type: string }
        changed_at: { type: string, format: date-time }

    ArchiveEntryDetail:
      allOf:
        - { $ref: '#/components/schemas/ArchiveEntry' }
        - type: object
          required: [revisions]
          properties:
            revisions:
              type: array
              items: { $ref: '#/components/schemas/ArchiveRevision' }

    ArchivePage:
      type: object
      required: [items, total, page, limit, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArchiveEntry' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 200 }
        has_more: { type: boolean }

    ArchiveRootPolicy:
      type: object
      required: [root_key, label, configured]
      properties:
        root_key: { type: string }
        label: { type: string }
        configured: { type: boolean, description: 根目录当前可用；不返回机器路径 }

    ArchivePlatformOption:
      type: object
      required: [value, label]
      properties:
        value: { $ref: '#/components/schemas/Platform' }
        label: { type: string }

    ArchivePolicy:
      type: object
      required: [timezone, directory_template, information_files, collection_file_name, catalog_file_name, platforms, roots]
      properties:
        timezone: { type: string, enum: [Asia/Shanghai] }
        directory_template: { type: string }
        information_files:
          type: array
          items: { type: string }
        collection_file_name: { type: string }
        catalog_file_name: { type: string }
        platforms:
          type: array
          items: { $ref: '#/components/schemas/ArchivePlatformOption' }
        roots:
          type: array
          items: { $ref: '#/components/schemas/ArchiveRootPolicy' }

    ArchiveJob:
      type: object
      required: [id, job_type, status, root_key, relative_directory, archive_entry_id, cursor, statistics, error, lease_owner, lease_expires_at, lease_attempts, created_at, updated_at, started_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        job_type: { $ref: '#/components/schemas/ArchiveJobType' }
        status: { $ref: '#/components/schemas/ArchiveJobStatus' }
        root_key: { type: string, nullable: true }
        relative_directory: { type: string, nullable: true }
        archive_entry_id: { type: integer, nullable: true }
        cursor: { type: object, additionalProperties: true }
        statistics: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
        lease_owner: { type: string, nullable: true }
        lease_expires_at: { type: string, format: date-time, nullable: true }
        lease_attempts: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }

    ArchiveScanRequest:
      type: object
      required: [root_key]
      additionalProperties: false
      properties:
        root_key: { type: string, minLength: 1, maxLength: 32 }
        relative_directory: { type: string, nullable: true, maxLength: 1000 }

    ArchiveMetadataPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        external_id: { type: string, nullable: true, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 1000 }
        url: { type: string, nullable: true, maxLength: 2000 }
        creator_id: { type: integer, nullable: true, minimum: 1 }
        creator_label: { type: string, nullable: true, maxLength: 500 }
        group_id: { type: integer, nullable: true, minimum: 1 }
        group_label: { type: string, nullable: true, maxLength: 500 }
        published_at: { type: string, format: date-time, nullable: true }
        published_time_precision: { type: string, nullable: true, maxLength: 20 }

    TaskStage:
      type: object
      properties:
        stage:
          type: string
          enum: [parse, download, transcribe, frames, note]
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        attempts: { type: integer }
        error: { type: string, nullable: true }

    ClassifyRequest:
      type: object
      required: [group_id]
      properties:
        group_id: { type: integer, minimum: 1 }
        tags:
          type: array
          description: '确认/新增标签名（不带 #）'
          items: { type: string, maxLength: 50 }
        creator_id:
          type: integer
          nullable: true
          description: 可选绑定博主（点赞收藏作品元数据可提供作者）

    Frame:
      type: object
      properties:
        file: { type: string, example: 'frames/frame_0001.jpg' }
        time_seconds: { type: number, format: float }
        window_start: { type: number, format: float, nullable: true }
        window_end: { type: number, format: float, nullable: true }
        hits:
          type: array
          items:
            type: object
            properties:
              term: { type: string }
              action: { type: string, enum: [increase, decrease] }
              weight: { type: number, format: float }
        confidence: { type: number, format: float }

    # ---------- groups ----------
    GroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 分组名（如 财经）

    GroupUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    Group:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        creator_count: { type: integer, default: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------- tags ----------
    Tag:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: integer }
        name: { type: string, description: '不带 #，展示时加 #' }
        kind: { $ref: '#/components/schemas/TagKind' }
        work_count: { type: integer, default: 0 }

    # ---------- lexicon ----------
    LexiconCreate:
      type: object
      required: [term, action]
      properties:
        term:
          type: string
          minLength: 1
          maxLength: 50
        action:
          type: string
          enum: [increase, decrease]
          description: increase=增加关键帧 / decrease=减少关键帧
        weight:
          type: number
          format: float
          default: 1.0
        enabled:
          type: boolean
          default: true
        platform_scope:
          type: string
          nullable: true
          description: 预留：null=全平台生效

    LexiconUpdate:
      type: object
      properties:
        term: { type: string, minLength: 1, maxLength: 50 }
        action: { type: string, enum: [increase, decrease] }
        weight: { type: number, format: float }
        enabled: { type: boolean }
        platform_scope: { type: string, nullable: true }

    LexiconItem:
      type: object
      required: [id, term, action, weight, enabled]
      properties:
        id: { type: integer }
        term: { type: string }
        action: { type: string, enum: [increase, decrease] }
        weight: { type: number, format: float }
        enabled: { type: boolean }
        platform_scope: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------- health ----------
    CookieHealth:
      type: object
      required: [platform, status]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        status:
          type: string
          enum: [OK, WARN, NEEDS_RELOGIN, UNKNOWN]
        last_checked_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }

    SystemHealth:
      type: object
      required: [component, status]
      properties:
        component:
          type: string
          enum: [aggregator, monitor, rsshub, changedetection, downloader, transcriber, workbuddy_pending]
        status:
          type: string
          enum: [online, offline, degraded, unknown]
        detail: { type: string, nullable: true }

    # ---------- xhs comments ----------
    XhsCommentJobCreate:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 2000 }
        include_images: { type: boolean, default: true }
        include_voice: { type: boolean, default: false }
        voice_authorized:
          type: boolean
          default: false
          description: 提取语音转写需用户明确授权本次打开作品页
        voice_allow_open_page:
          type: boolean
          default: false
          description: 未找到已打开的作品页时是否允许新开标签页；需与 voice_authorized 同时为真

    XhsCommentJobProgress:
      type: object
      properties:
        pages_fetched: { type: integer }
        comments_fetched: { type: integer }
        main_comments: { type: integer }
        replies_fetched: { type: integer }
        images_total: { type: integer }
        images_done: { type: integer }
        images_failed: { type: integer }
        voice_status: { type: string }
        message: { type: string }

    XhsCommentJob:
      type: object
      required: [job_id, note_id, url, status, phase, mode]
      properties:
        job_id: { type: string }
        note_id: { type: string }
        url: { type: string }
        status:
          type: string
          enum: [queued, running, completed, incomplete, failed]
        phase: { type: string }
        mode:
          type: string
          enum: [live, fixture]
          description: fixture 表示模拟数据，未访问真实平台
        include_images: { type: boolean }
        include_voice: { type: boolean }
        voice_authorized: { type: boolean }
        voice_allow_open_page: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
        error: { type: string, nullable: true }
        result_available: { type: boolean }
        progress: { $ref: '#/components/schemas/XhsCommentJobProgress' }

    XhsCommentCompleteness:
      type: object
      required: [status, pages_fetched, page_end_reached]
      properties:
        status:
          type: string
          enum: [complete, incomplete, failed]
        pages_fetched: { type: integer }
        page_end_reached: { type: boolean }
        platform_total: { type: integer, nullable: true }
        main_fetched: { type: integer }
        replies_fetched: { type: integer }
        reasons: { type: array, items: { type: string } }
        reason_texts: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        warning_texts: { type: array, items: { type: string } }
        reply_shortfall:
          type: array
          items:
            type: object
            properties:
              comment_id: { type: string }
              expected: { type: integer }
              fetched: { type: integer }
        fatal_error: { type: string, nullable: true }

    XhsCommentResult:
      type: object
      required: [note_id, source_url, collected_at, completeness, comments]
      properties:
        schema_version: { type: integer }
        note_id: { type: string }
        source_url: { type: string }
        collected_at: { type: string }
        first_collected_at: { type: string }
        collector:
          type: object
          properties:
            mode: { type: string, enum: [live, fixture] }
            engine: { type: string }
        note_meta:
          type: object
          properties:
            status: { type: string }
            title: { type: string, nullable: true }
            author: { type: string, nullable: true }
            platform_total: { type: integer, nullable: true }
        completeness: { $ref: '#/components/schemas/XhsCommentCompleteness' }
        order:
          type: object
          properties:
            main: { type: string, example: like_desc }
            replies: { type: string, example: like_desc }
        pinned_comment_id: { type: string, nullable: true }
        counts:
          type: object
          additionalProperties: { type: integer }
        voice_run:
          type: object
          properties:
            requested: { type: boolean }
            status: { type: string, enum: [not_requested, extracted, not_extracted, failed] }
            page_mode: { type: string }
            cdp_available: { type: boolean }
            opened_new_page: { type: boolean }
            pages_scanned: { type: integer }
            matched_page_count: { type: integer }
            failure_reason: { type: string, nullable: true }
            extracted: { type: integer }
            associated: { type: integer }
            unassociated:
              type: array
              items:
                type: object
                properties:
                  text: { type: string }
                  nickname: { type: string, nullable: true }
                  like_count: { type: integer, nullable: true }
                  evidence: { type: string }
        comments:
          type: array
          items: { type: object, additionalProperties: true }
        report_available: { type: boolean }

    XhsCommentNoteSummary:
      type: object
      properties:
        note_id: { type: string }
        title: { type: string, nullable: true }
        source_url: { type: string }
        collected_at: { type: string }
        first_collected_at: { type: string }
        mode: { type: string, enum: [live, fixture] }
        completeness_status: { type: string, enum: [complete, incomplete, failed] }
        completeness_reasons: { type: array, items: { type: string } }
        counts:
          type: object
          additionalProperties: { type: integer }
        pinned_comment_id: { type: string, nullable: true }
        voice_status: { type: string }
        report_available: { type: boolean }

    # ---------- wechat ----------
    WechatImportRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        title: { type: string, nullable: true }

  responses:
    Unauthorized:
      description: 未认证 / token 缺失或错误
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  code: { type: integer, example: 401 }
                  message: { type: string, example: 'AUTH_REQUIRED' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  code: { type: integer, example: 404 }
                  message: { type: string, example: 'NOT_FOUND' }
    Conflict:
      description: 冲突（重复创建/非法状态迁移）
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  code: { type: integer, example: 409 }
                  message: { type: string, example: 'CONFLICT' }
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  code: { type: integer, example: 422 }
                  message: { type: string, example: 'VALIDATION_ERROR' }
    MonitorOffline:
      description: 监控层离线
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  code: { type: integer, example: 1002 }
                  message: { type: string, example: 'MONITOR_OFFLINE' }
    NotImplemented:
      description: 功能未实现（预留占位）
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  code: { type: integer, example: 501 }
                  message: { type: string, example: 'NOT_IMPLEMENTED' }
